<!--
  MUSTER: Moodle-Aktivitäts-Beschreibung (kleiner Teaser unter dem Aktivitätslink)
  =================================================================================
  Einfügen in: Aktivität bearbeiten -> Beschreibung -> Haken bei
  "Beschreibung auf Kursseite anzeigen" setzen -> speichern.

  Gleiche Regeln wie beim Abschnitts-Banner (Templates/html/section-banner-template.html):
  nur inline style="", keine Gradients, kein <style>/<script>.

  Platzhalter: {{TEXT}} {{FARBE}}
  Farb-Konvention für diese Aktivitäts-Teaser:
    Indigo #667eea = Aufgabe/Übung (Abgabe)
    Grün   #4caf50 = Lösung (Selbstkontrolle)
    Blau   #0288d1 = Einführung/Info-Seite
-->
<div style="border-left:4px solid {{FARBE}}; background-color:#f8f9fa; border-radius:6px; padding:8px 12px; font-size:13px; color:#495057; margin:4px 0;">{{TEXT}}</div>
